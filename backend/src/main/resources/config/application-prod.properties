# Profilo prod — ambiente Elastic Beanstalk bilanciato (ALB + WAF).
# Attivazione: SPRING_PROFILES_ACTIVE=prod
# URL/credenziali DB e JWT_SECRET arrivano dagli env var iniettati da Terraform:
# NON mettere segreti qui.

# In prod lo schema DB deve gia' esistere: Hibernate valida soltanto.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Superficie ridotta: niente Swagger in produzione.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# TLS terminato dal load balancer; l'app dietro l'ALB parla HTTP.
server.ssl.enabled=false
