# Profilo LOCAL — avvio a "DB scollegato": nessun database esterno da installare.
# Attivazione: SPRING_PROFILES_ACTIVE=local
#
# Usa un DB H2 in-memory (i dati vivono in RAM e si azzerano ad ogni riavvio),
# cosi' il template parte subito dopo la clonazione. Al primo avvio viene creato
# l'utente demo definito qui sotto: admin / admin.

# --- Datasource H2 in-memory ---
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:plumma;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea lo schema in memoria ad ogni avvio (dialect H2 rilevato in automatico).
spring.jpa.hibernate.ddl-auto=create-drop

# --- Utente demo locale: admin / admin ---
app.demo-user.enabled=true
app.demo-user.username=admin
app.demo-user.email=admin@example.com
app.demo-user.password=admin
app.demo-user.role=admin

# Swagger utile in locale.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
