# Profilo dev — ambiente Elastic Beanstalk leggero, SingleInstance (non bilanciato).
# Attivazione: SPRING_PROFILES_ACTIVE=dev
# URL/credenziali DB e JWT_SECRET arrivano dagli env var iniettati da Terraform.

# In dev lasciamo che Hibernate allinei lo schema automaticamente.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Swagger utile in dev.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

server.ssl.enabled=false
