spring.application.name=plumma-template
# Profilo attivo: di default 'local' (H2 in-memory, nessun DB esterno) cosi' l'app parte
# subito dopo il clone anche con un semplice RUN da IDE. In dev/prod l'env var
# SPRING_PROFILES_ACTIVE (iniettata da Terraform) ha la precedenza e seleziona dev|prod.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# In locale puoi sovrascrivere qualsiasi valore con un application-local.properties a root.
spring.config.import=optional:classpath:application-local.properties,optional:file:./application-local.properties

# ---------------------------------------------------------------------------
# Applicazione
# ---------------------------------------------------------------------------
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:3000}

# Utente demo locale: creato al primo avvio se la tabella utenti e' vuota.
# In produzione disabilitalo (APP_DEMO_USER_ENABLED=false) o cambia le credenziali.
app.demo-user.enabled=${APP_DEMO_USER_ENABLED:true}
app.demo-user.username=${APP_DEMO_USER_USERNAME:demo}
app.demo-user.email=${APP_DEMO_USER_EMAIL:demo@example.com}
app.demo-user.password=${APP_DEMO_USER_PASSWORD:demo1234}
app.demo-user.role=${APP_DEMO_USER_ROLE:admin}

# ---------------------------------------------------------------------------
# JWT (HMAC HS256). Il segreto DEVE essere >= 32 byte. In prod passalo via env.
# ---------------------------------------------------------------------------
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-32b+}

# ---------------------------------------------------------------------------
# OAuth2 / OIDC social login (Google + Microsoft 365). Facoltativo: se non
# configurato, il pulsante relativo restituira' un errore "not configured".
# NON mettere segreti reali qui: passali via env (registra le app sui provider).
# redirect_uri da registrare: <backend-base-url>/api/public/oauth/{google|azure}/callback
# ---------------------------------------------------------------------------
oauth.frontend-redirect-url=${OAUTH_FRONTEND_REDIRECT_URL:http://localhost:3000/oauth/callback}
oauth.backend-base-url=${OAUTH_BACKEND_BASE_URL:http://localhost:8080}

oauth.google.client-id=${OAUTH_GOOGLE_CLIENT_ID:}
oauth.google.client-secret=${OAUTH_GOOGLE_CLIENT_SECRET:}
oauth.google.authorization-url=${OAUTH_GOOGLE_AUTHORIZATION_URL:https://accounts.google.com/o/oauth2/v2/auth}
oauth.google.token-url=${OAUTH_GOOGLE_TOKEN_URL:https://www.googleapis.com/oauth2/v4/token}
oauth.google.user-info-url=${OAUTH_GOOGLE_USER_INFO_URL:https://www.googleapis.com/oauth2/v3/userinfo}
oauth.google.scopes=${OAUTH_GOOGLE_SCOPES:openid email}

oauth.azure.client-id=${OAUTH_AZURE_CLIENT_ID:}
oauth.azure.client-secret=${OAUTH_AZURE_CLIENT_SECRET:}
oauth.azure.authorization-url=${OAUTH_AZURE_AUTHORIZATION_URL:https://login.microsoftonline.com/common/oauth2/v2.0/authorize}
oauth.azure.token-url=${OAUTH_AZURE_TOKEN_URL:https://login.microsoftonline.com/common/oauth2/v2.0/token}
oauth.azure.user-info-url=${OAUTH_AZURE_USER_INFO_URL:https://graph.microsoft.com/oidc/userinfo}
oauth.azure.scopes=${OAUTH_AZURE_SCOPES:openid email}

# ---------------------------------------------------------------------------
# Datasource JDBC. Il connettore (driver) e' esplicito qui: cambialo insieme
# alla dipendenza Maven per usare un DB diverso (MySQL, PostgreSQL, ...).
# In dev/prod l'URL e le credenziali arrivano dagli env var iniettati da Terraform.
# ---------------------------------------------------------------------------
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.driver-class-name=${JDBC_DATABASE_DRIVER:org.mariadb.jdbc.Driver}
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mariadb://localhost:3306/plumma_template?useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}
spring.datasource.hikari.pool-name=plummaTemplateHikariPool
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.initialization-fail-timeout=-1

spring.transaction.default-timeout=30

# ---------------------------------------------------------------------------
# JPA / Hibernate
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------------------------------------------------------------------------
# Error handling & logging
# ---------------------------------------------------------------------------
logging.level.com.plumma.template=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN

# ---------------------------------------------------------------------------
# OpenAPI / Swagger UI (abilitato in dev, disabilitato in prod)
# ---------------------------------------------------------------------------
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
